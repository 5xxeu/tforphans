name: cask

# The cask points at the release's archives, which are not downloadable
# while the release is a draft: it is written once the release is
# published. Needs HOMEBREW_TAP_TOKEN (contents write on 5xxeu/homebrew-tap
# only).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (v0.1.10)
        required: true

permissions:
  contents: read

jobs:
  cask:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the cask to the tap
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          case $TAG in
          v[0-9]*) ;;
          *) echo "bad tag: $TAG" >&2; exit 1 ;;
          esac
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -D "$RUNNER_TEMP"
          scripts/cask.sh "${TAG#v}" "$RUNNER_TEMP/checksums.txt" > "$RUNNER_TEMP/tforphans.rb"
          path=repos/5xxeu/homebrew-tap/contents/Casks/tforphans.rb
          sha=$(GH_TOKEN=$TAP_TOKEN gh api "$path" --jq .sha 2>/dev/null || true)
          GH_TOKEN=$TAP_TOKEN gh api -X PUT "$path" \
            -f message="tforphans ${TAG#v}" \
            -f content="$(base64 -w0 "$RUNNER_TEMP/tforphans.rb")" \
            -f committer[name]=NikitaPuglachenko \
            -f committer[email]=41295566+NikitaPuglachenko@users.noreply.github.com \
            ${sha:+-f sha="$sha"} --jq .commit.sha
