name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the integration tests with the race detector as well (slower),
  # and a few minutes of fuzzing.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3" # what releases are built with (release.yml)
      - name: one Go version in all workflows
        run: |
          test "$(grep -hoE 'go-version: "[0-9.]+"' .github/workflows/*.yml | sort -u | wc -l)" = 1
      - name: cask
        run: scripts/cask.sh 0.1.10 testdata/cask/checksums.txt | diff -u testdata/cask/tforphans.rb -
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet -tags integration,e2e ./...
      - name: vet for windows and darwin
        run: GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --build-tags integration,e2e
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Process groups, setsid and signals behave differently on macOS, where
  # many users run tforphans.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: go test -race ./...

  # Releases are built with the pinned Go above; this tells when the next Go
  # breaks something, before the pin moves.
  test-stable:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go version
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      # A failing input lands in testdata/fuzz; it is uploaded to be added
      # to the package as a regression case.
      - name: fuzz
        run: |
          go test -run '^$' -fuzz '^FuzzImportHCL$' -fuzztime 60s ./internal/report/
          go test -run '^$' -fuzz '^FuzzHCLString$' -fuzztime 30s ./internal/report/
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 60s ./internal/state/
          go test -run '^$' -fuzz '^FuzzParseQuery$' -fuzztime 60s ./internal/tf/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.14 is not here: its init ignores dev_overrides for providers that
        # only child modules declare, which the tests' fake provider needs.
        terraform: ["1.15.9", "1.16.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Install terragrunt
        env:
          TG_VERSION: v1.1.6
          TG_SHA256: d75a80bb264758ba00dabcb17f4b507fcdab4ca90d9e41f96750df036bf69b04
        run: |
          curl -sSfLo "$RUNNER_TEMP/terragrunt" "https://github.com/gruntwork-io/terragrunt/releases/download/$TG_VERSION/terragrunt_linux_amd64"
          echo "$TG_SHA256  $RUNNER_TEMP/terragrunt" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/terragrunt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: go test -tags integration -count=1 $RACE .
        env:
          RACE: ${{ github.event_name == 'schedule' && '-race' || '' }}
