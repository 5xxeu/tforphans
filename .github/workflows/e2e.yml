name: e2e

# A scan of a real Cloudflare zone (e2e_test.go). Never on pull requests:
# the token lives in the cloudflare-e2e environment.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    environment: cloudflare-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: e2e
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_ZONE_ID: ${{ vars.E2E_ZONE_ID }}
        run: |
          # Without them the test skips, which must not pass as a run.
          : "${CLOUDFLARE_API_TOKEN:?not set}"
          : "${E2E_ZONE_ID:?not set}"
          go test -tags e2e -count=1 -run '^TestE2E' -v .
